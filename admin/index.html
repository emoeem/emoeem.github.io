<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>emoeem Studio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="./admin.css">
<link rel="stylesheet" href="./sync.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark">一</span><div><strong>emoeem Studio</strong><small>Personal Publishing Space</small></div></div>
  <div class="top-actions"><span id="connectionState" class="status-dot offline">未连接</span><button class="icon-btn" id="themeBtn" title="切换主题"><i class="fa fa-adjust"></i></button><a class="top-link" href="/" target="_blank"><i class="fa fa-external-link"></i> 博客</a><button class="top-link" id="logoutBtn">退出</button></div>
</header>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="loginView" class="login-view">
  <div class="login-card">
    <div class="login-icon"><i class="fa fa-lock"></i></div><p class="kicker">PRIVATE WORKSPACE</p><h1>进入后台</h1>
    <p>使用管理员密码登录。GitHub 凭据只保留在 Admin API 服务端。</p>
    <form id="loginForm" class="token-row">
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="管理员密码" required>
      <button id="loginSubmit" class="button" type="submit" style="width:100%">登录后台</button>
    </form>
    <div class="hint"><i class="fa fa-shield"></i> 浏览器只保存 HttpOnly Session，不保存 GitHub Token。</div>
  </div>
</div>
<div id="app" class="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="side-group"><p class="side-label">工作台</p><button class="nav-item active" data-view="dashboard"><i class="fa fa-th-large"></i><span>概览</span></button></div>
    <div class="side-group"><p class="side-label">内容</p><button class="nav-item" data-view="posts"><i class="fa fa-file-text-o"></i><span>文章</span><b id="postCount"></b></button><button class="nav-item" data-view="moments"><i class="fa fa-comment-o"></i><span>Moments</span></button></div>
    <div class="side-group"><p class="side-label">资源</p><button class="nav-item" data-view="media"><i class="fa fa-picture-o"></i><span>媒体与封面</span></button><button class="nav-item" data-view="taxonomy"><i class="fa fa-tags"></i><span>分类与标签</span></button></div>
    <div class="side-group"><p class="side-label">发布</p><button class="nav-item" data-view="publish"><i class="fa fa-cloud-upload"></i><span>发布中心</span></button><button class="nav-item sync-nav" data-view="sync"><i class="fa fa-github"></i><span>GitHub 文档同步</span><b id="syncCount"></b></button></div>
    <div class="side-group"><p class="side-label">系统</p><button class="nav-item" data-view="settings"><i class="fa fa-sliders"></i><span>设置</span></button></div>
    <div class="side-bottom"><div class="repo-card"><span>REPOSITORY</span><strong>emoeem/blog-source</strong><small>branch: main</small></div></div>
  </aside>
  <main class="main"><div class="mobile-head"><button id="menuBtn" class="icon-btn"><i class="fa fa-bars"></i></button><strong id="mobileTitle">概览</strong></div>
    <section id="view-dashboard" class="view active"></section>
    <section id="view-posts" class="view"></section>
    <section id="view-moments" class="view"></section>
    <section id="view-media" class="view"></section>
    <section id="view-taxonomy" class="view"></section>
    <section id="view-publish" class="view"></section>
    <section id="view-sync" class="view"></section>
    <section id="view-settings" class="view"></section>
  </main>
</div>
<div id="editorModal" class="modal" aria-hidden="true"><div class="modal-panel editor-panel"><div class="modal-head"><div><p class="kicker">WRITING STUDIO</p><h2 id="editorHeading">新建文章</h2></div><button class="icon-btn" data-close="editorModal"><i class="fa fa-times"></i></button></div>
  <div class="editor-meta"><div class="field grow"><label>标题</label><input id="title" placeholder="文章标题"></div><div class="field"><label>分类</label><input id="category" list="categoryList" placeholder="技术"><datalist id="categoryList"></datalist></div></div>
  <div class="field"><label>标签 <small>回车添加</small></label><div class="tag-input"><div id="selectedTags"></div><input id="tagInput" placeholder="Rust、Linux…"></div></div>
  <div class="editor-meta"><div class="field grow"><label>封面</label><div class="cover-input"><input id="coverImg" placeholder="/img/featureimages/custom_0.jpg"><button class="secondary" id="coverBtn"><i class="fa fa-picture-o"></i> 选择</button></div></div><div class="field"><label>摘要</label><input id="summary" placeholder="可选"></div></div>
  <div class="editor-meta"><div class="field"><label>状态</label><select id="postStatus"><option value="published">已发布</option><option value="draft">草稿</option><option value="hidden">隐藏</option></select></div><div class="field"><label>系列</label><input id="series" placeholder="配置指南"></div><div class="field"><label>系列序号</label><input id="seriesOrder" type="number" min="1" placeholder="1"></div><div class="field"><label>环境</label><input id="environment" placeholder="CachyOS / niri"></div></div>
  <div class="editor-meta"><div class="field grow"><label>SEO 描述</label><input id="seoDescription" placeholder="搜索引擎描述，可选"></div><div class="field grow"><label>关键词</label><input id="keywords" placeholder="Linux, Rust, CachyOS"></div><label class="setting-check"><input id="sticky" type="checkbox"> 置顶</label><label class="setting-check"><input id="comments" type="checkbox" checked> 评论</label></div>
  <div class="field editor-field"><label>正文 <span id="editorSaveState">尚未保存</span></label><textarea id="editor"></textarea></div>
  <div class="editor-foot"><span class="editor-tip"><kbd>Ctrl</kbd><kbd>S</kbd> 保存并提交 · <kbd>Ctrl</kbd><kbd>K</kbd> 命令/搜索</span><div><button class="secondary" id="draftBtn">保存草稿</button><button id="publishBtn">发布文章</button></div></div>
</div></div>
<div id="coverModal" class="modal" aria-hidden="true"><div class="modal-panel cover-panel"><div class="modal-head"><div><p class="kicker">MEDIA</p><h2>选择封面</h2></div><button class="icon-btn" data-close="coverModal"><i class="fa fa-times"></i></button></div><div class="cover-toolbar"><input id="coverSearch" placeholder="搜索图片文件名…"><button class="secondary" id="uploadCoverFromPicker"><i class="fa fa-upload"></i> 上传图片</button><button class="secondary" id="randomCover">随机</button></div><div id="coverGrid" class="cover-grid"></div></div></div><input id="mediaUploadInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
<div id="commandModal" class="modal" aria-hidden="true"><div class="modal-panel command-panel"><div class="command-input"><i class="fa fa-search"></i><input id="commandInput" placeholder="输入命令或搜索文章…" autocomplete="off"></div><div id="commandList"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="./runtime-config.js"></script>
<script>
const REPO='emoeem/blog-source',BRANCH='main',API_BASE=window.ADMIN_API_BASE||'',DRAFT_KEY='blog_editor_draft',MOMENTS_PATH='source/_data/shuoshuo.yml';
let login='',posts=[],drafts=[],tags=[],cats=[],selectedTags=[],currentSlug=null,currentPath=null,currentSha=null,editor=null,autoTimer=null,currentView='dashboard',moments=[],editingMoment=null,mediaItems=[];
let covers=[...Array.from({length:24},(_,i)=>`/img/featureimages/${i}.jpg`),...['125824107_p0.jpg','126350108_p0.jpg','126473642_p0.jpg','126666381_p0.jpg','126768762_p0.jpg','126768762_p1.jpg','126932450_p0.jpg','127246755_p0.jpg','146170421_p0.jpg','custom_0.jpg','custom_1.jpg','custom_2.jpg','custom_3.jpg','custom_4.jpg','custom_5.jpg'].map(x=>`/img/featureimages/${x}`),...Array.from({length:6},(_,i)=>`/img/covers/cover-${i+1}.jpg`),'/img/cover.jpg'];
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t,type='success'){const e=$('toast');e.textContent=t;e.className=`toast show ${type}`;clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='toast',3600)}
function setView(view){currentView=view;document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===`view-${view}`));$('mobileTitle').textContent={dashboard:'概览',posts:'文章',moments:'Moments',media:'媒体与封面',taxonomy:'分类与标签',publish:'发布中心',sync:'GitHub 文档同步',settings:'设置'}[view];if(innerWidth<900)$('sidebar').classList.remove('open');renderView(view)}
function renderView(v){if(v==='sync'){window.dispatchEvent(new CustomEvent('admin:sync-view'));return}({dashboard:renderDashboard,posts:renderPosts,moments:renderMoments,media:renderMedia,taxonomy:renderTaxonomy,publish:renderPublish,settings:renderSettings}[v])()}
async function api(path,method='GET',body){const githubPath=path.startsWith('repos/')?path:'repos/'+REPO+'/'+path;const r=await fetch((API_BASE||'')+'/api/github?path='+encodeURIComponent(githubPath),{method,credentials:'include',headers:{Accept:'application/vnd.github+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok){let e={};try{e=await r.json()}catch{};throw Error(e.message||r.status+' '+r.statusText)}return r.status===204?null:r.json()}
function decode(b64){const bytes=Uint8Array.from(atob(b64.replace(/\n/g,'')),c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function encode(s){return btoa(String.fromCharCode(...new TextEncoder().encode(s)))}
function parseFM(text){const out={title:'',date:'',categories:'',tags:[],img:'',summary:'',status:'published',sticky:false,series:'',seriesOrder:'',environment:'',description:'',keywords:'',comments:true,published:true,body:text};const m=text.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);if(!m)return out;out.body=m[2];const fm=m[1];for(const [key,rx] of [['title',/^title:\s*(.*)$/m],['date',/^date:\s*(.*)$/m],['categories',/^categories:\s*(.*)$/m],['img',/^img:\s*(.*)$/m],['summary',/^summary:\s*(.*)$/m],['status',/^status:\s*(.*)$/m],['series',/^series:\s*(.*)$/m],['seriesOrder',/^seriesOrder:\s*(.*)$/m],['environment',/^environment:\s*(.*)$/m],['description',/^description:\s*(.*)$/m],['keywords',/^keywords:\s*(.*)$/m],['sticky',/^sticky:\s*(.*)$/m],['comments',/^comments:\s*(.*)$/m],['published',/^published:\s*(.*)$/m]]){const x=fm.match(rx);if(x)out[key]=x[1].trim().replace(/^['"]|['"]$/g,'')}out.published=!(String(out.published).toLowerCase()==='false'||String(out.published)==='0');if(out.published===false)out.status='hidden';out.sticky=String(out.sticky).toLowerCase()==='true'||String(out.sticky)==='1';out.comments=!(String(out.comments).toLowerCase()==='false'||String(out.comments)==='0');const sec=fm.match(/^tags:\s*\n((?:\s*-\s*.*\n?)*)/m);if(sec)out.tags=[...sec[1].matchAll(/^\s*-\s*(.+)$/gm)].map(x=>x[1].trim().replace(/^['"]|['"]$/g,''));return out}
async function loadMedia(){try{const [feature,coversDir]=await Promise.all([api('contents/source/img/featureimages'),api('contents/source/img/covers')]);const items=[...(Array.isArray(feature)?feature:[]),...(Array.isArray(coversDir)?coversDir:[])].filter(x=>x.type==='file'&&/\.(?:jpe?g|png|webp|gif)$/i.test(x.name)).map(x=>({path:x.path,url:'/img/'+x.path.replace(/^source\/img\//,''),name:x.name,size:x.size||0,sha:x.sha}));mediaItems=items.sort((a,b)=>a.path.localeCompare(b.path));covers=mediaItems.map(x=>x.url);if(!covers.includes('/img/cover.jpg'))covers.push('/img/cover.jpg')}catch(e){console.warn('媒体索引加载失败',e)}}
async function loadData(){setConnection('连接中…','loading');try{const [files,draftFiles]=await Promise.all([api('contents/source/_posts'),api('contents/source/_drafts').catch(()=>[])]);const readList=async(list,isDraft)=>{const loaded=[];for(const f of (Array.isArray(list)?list:[]).filter(x=>x.name.endsWith('.md'))){try{const base=isDraft?'source/_drafts':'source/_posts';const r=await api('contents/'+base+'/'+encodeURIComponent(f.name)),p=parseFM(decode(r.content));p.slug=f.name.slice(0,-3);p.sha=r.sha;p.isDraft=isDraft;p.path=r.path;loaded.push(p)}catch{}}return loaded};posts=await readList(files,false);drafts=await readList(draftFiles,true);const all=[...posts,...drafts];const ct={},tg={};all.forEach(p=>{if(p.categories)ct[p.categories]=(ct[p.categories]||0)+1;p.tags.forEach(t=>tg[t]=(tg[t]||0)+1)});cats=Object.keys(ct).sort();tags=Object.keys(tg).sort();$('postCount').textContent=String(all.length);setConnection('已连接','online');renderView(currentView)}catch(e){setConnection('连接失败','error');toast('加载失败：'+e.message,'error')}}
function setConnection(text,state){$('connectionState').textContent=text;$('connectionState').className=`status-dot ${state}`}
async function checkSession(){try{const r=await fetch((API_BASE||'')+'/api/auth/me',{credentials:'include',cache:'no-store',headers:{'Cache-Control':'no-cache'}});if(!r.ok)throw Error('未登录');const d=await r.json();login=d.login||'';return {ok:true}}catch(e){return {ok:false,message:e.message}}}
async function loginWithPassword(e){e?.preventDefault();const password=$('loginPassword').value;const button=$('loginSubmit');if(!password)return;button.disabled=true;button.textContent='登录中…';try{const r=await fetch((API_BASE||'')+'/api/auth/login',{method:'POST',credentials:'include',cache:'no-store',headers:{'Content-Type':'application/json','Cache-Control':'no-cache'},body:JSON.stringify({password})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'登录失败');login=d.login||'';$('loginPassword').value='';await init()}catch(e){toast(e.message,'error')}finally{button.disabled=false;button.textContent='登录后台'}}
async function init(){$('loginView').hidden=true;$('app').hidden=false;initEditor();if(login){await Promise.all([loadMedia(),loadMoments(),loadData()])}else{setConnection('未连接 GitHub','error')}renderView(currentView)}
$('loginForm').addEventListener('submit',loginWithPassword);$('logoutBtn').onclick=async()=>{await fetch((API_BASE||'')+'/api/auth/logout',{method:'POST',credentials:'include'});location.reload()};$('themeBtn').onclick=()=>{const dark=document.documentElement.classList.toggle('dark');localStorage.setItem('admin_dark',dark?'1':'0')};$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>setView(b.dataset.view));
function initEditor(){if(editor)return;editor=new EasyMDE({element:$('editor'),spellChecker:false,status:['lines','words','cursor'],minHeight:'430px',placeholder:'开始写 Markdown…',toolbar:['heading-2','heading-3','bold','italic','|','quote','unordered-list','ordered-list','|','link','image','code','table','horizontal-rule','|','preview','side-by-side','fullscreen','|','guide']});editor.codemirror.on('change',scheduleDraft);['title','category','tagInput','coverImg','summary','postStatus','series','seriesOrder','environment','seoDescription','keywords','sticky','comments'].forEach(id=>$(id)?.addEventListener('input',scheduleDraft));$('tagInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addTag(e.target.value.trim());e.target.value=''}});$('publishBtn').onclick=publish;$('draftBtn').onclick=saveDraftRemote;$('coverBtn').onclick=openCoverPicker;$('uploadCoverFromPicker').onclick=()=>$('mediaUploadInput').click();$('mediaUploadInput').onchange=e=>uploadMediaFile(e.target.files?.[0])}
function scheduleDraft(){clearTimeout(autoTimer);$('editorSaveState').textContent='正在保存…';autoTimer=setTimeout(()=>saveDraft(false),800)}
function saveDraft(show){if(!editor)return;localStorage.setItem(DRAFT_KEY,JSON.stringify({title:$('title').value,category:$('category').value,tags:selectedTags,coverImg:$('coverImg').value,summary:$('summary').value,body:editor.value(),updatedAt:new Date().toISOString()}));$('editorSaveState').textContent='本地草稿已保存';if(show)toast('草稿已保存在此浏览器')}
function restoreDraft(){try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY));if(!d)return;$('title').value=d.title||'';$('category').value=d.category||'';$('coverImg').value=d.coverImg||'';$('summary').value=d.summary||'';selectedTags=d.tags||[];editor.value(d.body||'');renderSelectedTags();$('editorSaveState').textContent='已恢复本地草稿'}catch{localStorage.removeItem(DRAFT_KEY)}}
function openEditor(post=null){currentSlug=post?.slug||null;currentPath=post?.path||null;currentSha=post?.sha||null;$('editorHeading').textContent=post?'编辑 · '+(post.title||post.slug):'新建文章';$('title').value=post?.title||'';$('category').value=post?.categories||'';$('coverImg').value=post?.img||'';$('summary').value=post?.summary||'';$('postStatus').value=post?.status||(post?.isDraft?'draft':'published');$('series').value=post?.series||'';$('seriesOrder').value=post?.seriesOrder||'';$('environment').value=post?.environment||'';$('seoDescription').value=post?.description||'';$('keywords').value=post?.keywords||'';$('sticky').checked=!!post?.sticky;$('comments').checked=post?.comments!==false;selectedTags=post?.tags?.slice()||[];renderSelectedTags();editor.value(post?.body||'');$('editorSaveState').textContent=post?'已加载文章':'尚未保存';if(!post)restoreDraft();$('editorModal').classList.add('open');$('editorModal').setAttribute('aria-hidden','false');setTimeout(()=>$('title').focus(),80)}
function closeModal(id){$(id).classList.remove('open');$(id).setAttribute('aria-hidden','true')};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)closeModal(m.id)});
function addTag(t){if(t&&!selectedTags.includes(t)){selectedTags.push(t);if(!tags.includes(t))tags.push(t);renderSelectedTags()}}
function removeTag(t){selectedTags=selectedTags.filter(x=>x!==t);renderSelectedTags()};function renderSelectedTags(){$('selectedTags').innerHTML=selectedTags.map(t=>`<span class="tag-chip">${esc(t)} <button onclick="removeTag('${esc(t).replaceAll("'","\\'")}')">×</button></span>`).join('')}
function buildFM(title,cat,ts,img,summary,date,meta={}){let s='---\ntitle: '+title+'\ndate: '+(date||new Date().toISOString().replace('T',' ').slice(0,19))+'\n';if(cat)s+='categories: '+cat+'\n';if(ts.length)s+='tags:\n'+ts.map(t=>'  - '+t+'\n').join('');if(img)s+='img: '+img+'\n';if(summary)s+='summary: '+summary+'\n';if(meta.status&&meta.status!=='published')s+='status: '+meta.status+'\n';if(meta.status==='hidden')s+='published: false\n';if(meta.sticky)s+='sticky: true\n';if(meta.series)s+='series: '+meta.series+'\n';if(meta.seriesOrder)s+='seriesOrder: '+meta.seriesOrder+'\n';if(meta.environment)s+='environment: '+meta.environment+'\n';if(meta.description)s+='description: '+meta.description+'\n';if(meta.keywords)s+='keywords: '+meta.keywords+'\n';if(meta.comments===false)s+='comments: false\n';return s+'---\n\n'}
function slugify(s){return s.trim().replace(/[^\w\u4e00-\u9fff]+/g,'-').replace(/^-+|-+$/g,'')||'untitled'}
async function publish(){const title=$('title').value.trim(),body=editor.value();if(!title)return toast('请输入标题','error');if(!body.trim())return toast('请输入正文','error');const old=posts.find(p=>p.slug===currentSlug);const slug=slugify(title),path=`source/_posts/${slug}.md`;try{$('publishBtn').disabled=true;let sha=currentSha;if(currentSlug&&currentSlug!==slug){await api(`contents/source/_posts/${encodeURIComponent(currentSlug)}.md`,'DELETE',{message:`重命名: ${currentSlug}`,sha:currentSha,branch:BRANCH});sha=null}await api(`contents/${path}`,'PUT',{message:`${sha?'更新':'新增'}: ${title}`,content:encode(buildFM(title,$('category').value.trim(),selectedTags,$('coverImg').value.trim(),$('summary').value.trim(),old?.date)+body),branch:BRANCH,...(sha?{sha}:{})});localStorage.removeItem(DRAFT_KEY);closeModal('editorModal');toast('文章已提交，GitHub Actions 将自动构建');await loadData();setView('publish')}catch(e){toast(`发布失败：${e.message}`,'error')}finally{$('publishBtn').disabled=false}}
async function deletePost(slug,sha,title){if(!confirm(`确定删除「${title||slug}」？此操作会直接提交 GitHub。`))return;try{await api(`contents/source/_posts/${encodeURIComponent(slug)}.md`,'DELETE',{message:`删除: ${slug}`,sha,branch:BRANCH});toast('文章已删除');await loadData()}catch(e){toast(`删除失败：${e.message}`,'error')}}
function renderDashboard(){const recent=posts.slice(0,5);$('view-dashboard').innerHTML=`<div class="page-head"><div><p class="kicker">PERSONAL PUBLISHING SPACE</p><h1>你好，emoeem</h1><p>写代码、做开源项目，也记录正在发生的事情。</p></div><button id="dashNew"><i class="fa fa-pencil"></i> 新建文章</button></div><div class="stats"><div><span>文章</span><strong>${posts.length}</strong><small>全部文章</small></div><div><span>分类</span><strong>${cats.length}</strong><small>内容分类</small></div><div><span>标签</span><strong>${tags.length}</strong><small>内容标签</small></div><div><span>Moments</span><strong>${moments.length||'—'}</strong><small>碎片记录</small></div></div><div class="dash-grid"><div class="panel"><div class="panel-head"><h2>最近文章</h2><button class="text-btn" id="allPosts">查看全部</button></div>${recent.length?recent.map(postRow).join(''):'<div class="empty">还没有文章</div>'}</div><div class="panel"><div class="panel-head"><h2>快捷操作</h2></div><div class="quick-grid"><button id="quickNew"><i class="fa fa-pencil"></i> 写文章</button><button data-go="moments"><i class="fa fa-comment-o"></i> 写 Moments</button><button data-go="media"><i class="fa fa-picture-o"></i> 媒体库</button><button data-go="publish"><i class="fa fa-cloud-upload"></i> 发布状态</button></div><div class="workspace-note"><span class="note-icon"><i class="fa fa-code"></i></span><div><strong>Git 工作流</strong><p>内容 → Commit → Actions → Pages。后台不维护虚假数据库，仓库就是内容源。</p></div></div></div></div>`;$('dashNew').onclick=()=>openEditor();$('quickNew').onclick=()=>openEditor();$('allPosts').onclick=()=>setView('posts');$('view-dashboard').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setView(b.dataset.go));recent.forEach((p,i)=>{$(`dash-edit-${i}`)?.addEventListener('click',()=>openEditor(p))})}

function renderPosts(){const q=($('postQuery')?.value||'').toLowerCase(),filter=$('postFilter')?.value||'all';let list=posts.filter(p=>!q||`${p.title} ${p.slug} ${p.body}`.toLowerCase().includes(q));if(filter==='tag')list=list.filter(p=>p.tags.length);if(filter==='uncat')list=list.filter(p=>!p.categories);$('view-posts').innerHTML=`<div class="page-head"><div><p class="kicker">CONTENT</p><h1>文章</h1><p>${posts.length} 篇文章 · Markdown 源码直接托管在 GitHub。</p></div><button id="newPost"><i class="fa fa-pencil"></i> 新建文章</button></div><div class="toolbar"><div class="search-field"><i class="fa fa-search"></i><input id="postQuery" value="${esc(q)}" placeholder="搜索标题、Slug、正文…"></div><select id="postFilter"><option value="all">全部文章</option><option value="tag">有标签</option><option value="uncat">未分类</option></select><button class="secondary" id="refreshPosts"><i class="fa fa-refresh"></i> 刷新</button></div><div class="panel post-table"><div class="table-head"><span>文章</span><span>分类</span><span>标签</span><span>日期</span><span></span></div>${list.length?list.map((p)=>`<div class="table-row"><div><strong>${esc(p.title||p.slug)}</strong><small>${esc(p.slug)}</small></div><span>${esc(p.categories||'—')}</span><span class="tag-text">${esc(p.tags.join(' · ')||'—')}</span><span>${esc((p.date||'').slice(0,10))}</span><div class="row-actions"><button class="mini-btn edit-post" data-i="${posts.indexOf(p)}"><i class="fa fa-pencil"></i></button><button class="mini-btn danger-mini delete-post" data-i="${posts.indexOf(p)}"><i class="fa fa-trash-o"></i></button></div></div>`).join(''):'<div class="empty"><i class="fa fa-file-text-o"></i><strong>没有匹配文章</strong><span>换一个关键词试试。</span></div>'}</div>`;$('newPost').onclick=()=>openEditor();$('postQuery').oninput=renderPosts;$('postFilter').onchange=renderPosts;$('refreshPosts').onclick=loadData;document.querySelectorAll('.edit-post').forEach(b=>b.onclick=()=>openEditor(posts[+b.dataset.i]));document.querySelectorAll('.delete-post').forEach(b=>b.onclick=()= function bytesToBase64(bytes){let binary='';for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(binary)}
async function uploadMediaFile(file){if(!file)return;if(!/^image\/(?:jpeg|png|webp|gif)$/.test(file.type))return toast('仅支持 JPG、PNG、WebP、GIF','error');if(file.size>10*1024*1024)return toast('图片不能超过 10 MB','error');const name=file.name.normalize('NFKC').replace(/[^\w\u4e00-\u9fff.-]+/g,'-').replace(/^-+|-+$/g,'');if(!name)return toast('无法识别图片文件名','error');const path=`public/img/featureimages/${name}`;try{try{await api(`contents/${path}`);return toast('同名图片已存在，请换一个文件名','error')}catch(e){if(!/^404 /.test(e.message))throw e}toast('正在上传图片…','success');const bytes=new Uint8Array(await file.arrayBuffer());await api(`contents/${path}`,'PUT',{message:`上传封面: ${name}`,content:bytesToBase64(bytes),branch:BRANCH});const src='/img/featureimages/'+name;covers=[...new Set([...covers,src])].sort();$('coverImg').value=src;renderMedia();if($('coverModal').classList.contains('open'))renderCoverGrid();toast('图片已上传到 GitHub');}catch(e){toast(`图片上传失败：${e.message}`,'error')}finally{$('mediaUploadInput').value=''}}

async function loadMoments(){try{const r=await api(`contents/${MOMENTS_PATH}`);moments=decode(r.content);moments=parseMoments(moments);return r}catch{moments=[]}}
function parseMoments(text){try{const data=jsyaml.load(text);return Array.isArray(data)?data.map(m=>({key:m.key||`moment-${Date.now()}`,date:String(m.date||''),author:m.author||'emoeem',content:String(m.content||'').trim(),tags:Array.isArray(m.tags)?m.tags.join(', '):String(m.tags||'')})):[]}catch{return[]}}
function renderMoments(){loadMoments().then(()=>{$('view-moments').innerHTML=`<div class="page-head"><div><p class="kicker">PERSONAL LOG</p><h1>Moments</h1><p>记录开发、生活与灵感碎片，直接写回 <code>shuoshuo.yml</code>。</p></div><button id="newMoment"><i class="fa fa-comment-o"></i> 新建动态</button></div><div id="momentEditor" class="panel moment-editor" hidden><div class="panel-head"><h2>编辑动态</h2><button class="icon-btn" id="closeMoment"><i class="fa fa-times"></i></button></div><div class="field"><label>内容</label><textarea id="momentContent" rows="5" placeholder="今天做了什么？"></textarea></div><div class="editor-meta"><div class="field"><label>日期</label><input id="momentDate" type="datetime-local"></div><div class="field grow"><label>标签</label><input id="momentTags" placeholder="Rust, Linux"></div></div><div><button class="secondary" id="cancelMoment">取消</button> <button id="saveMoment">保存到 GitHub</button></div></div><div class="moment-list">${moments.length?moments.map((m,i)=>`<article class="moment-card"><time>${esc(m.date)}</time><p>${esc(m.content)}</p><div><span>${esc(m.tags||'')}</span><button class="mini-btn danger-mini" data-mi="${i}"><i class="fa fa-trash-o"></i></button></div></article>`).join(''):'<div class="empty">暂无 Moments</div>'}</div>`;const show=()=>{$('momentEditor').hidden=false;$('momentContent').focus()};$('newMoment').onclick=show;$('closeMoment').onclick=$('cancelMoment').onclick=()=>{$('momentEditor').hidden=true};$('saveMoment').onclick=saveMoment;document.querySelectorAll('[data-mi]').forEach(b=>b.onclick=()=>removeMoment(+b.dataset.mi))})}
function momentsYaml(items){return jsyaml.dump(items.map(m=>({author:m.author||'emoeem',avatar:'/img/avatar.png',date:m.date,key:m.key,content:m.content,tags:m.tags?m.tags.split(',').map(x=>x.trim()).filter(Boolean):[]})),{lineWidth:1000,noRefs:true})}
async function saveMoment(){const content=$('momentContent').value.trim(),date=$('momentDate').value.replace('T',' '),tags=$('momentTags').value.trim();if(!content)return toast('请输入内容','error');try{const r=await api(`contents/${MOMENTS_PATH}`);const items=parseMoments(decode(r.content));items.unshift({key:`moment-${Date.now()}`,date:date||new Date().toISOString().replace('T',' ').slice(0,16),content,tags});await api(`contents/${MOMENTS_PATH}`,'PUT',{message:'新增: Moments',content:encode(momentsYaml(items)),sha:r.sha,branch:BRANCH});toast('Moments 已保存');setView('moments')}catch(e){toast(`保存失败：${e.message}`,'error')}}

async function renderPublish(){let runs=[];try{runs=(await api('actions/runs?per_page=8')).workflow_runs||[]}catch(e){}$('view-publish').innerHTML=`<div class="page-head"><div><p class="kicker">DELIVERY</p><h1>发布中心</h1><p>GitHub 是内容源，Actions 负责构建，Pages 负责展示。</p></div><a class="button secondary" href="https://github.com/${REPO}/actions" target="_blank"><i class="fa fa-github"></i> Actions</a></div><div class="pipeline"><div><i class="fa fa-pencil"></i><strong>内容</strong><span>Markdown / YAML</span></div><b>→</b><div><i class="fa fa-code-fork"></i><strong>Commit</strong><span>main</span></div><b>→</b><div><i class="fa fa-cogs"></i><strong>Build</strong><span>Hexo</span></div><b>→</b><div><i class="fa fa-globe"></i><strong>Pages</strong><span>emoeem.github.io</span></div></div><div class="panel"><div class="panel-head"><h2>最近部署</h2><button class="text-btn" id="refreshRuns">刷新</button></div>${runs.length?runs.map(r=>`<div class="deploy-row"><span class="run-dot ${r.conclusion==='success'?'ok':r.status==='in_progress'?'run':'bad'}"></span><div><strong>${esc(r.name)}</strong><small>${esc(r.head_commit?.message||r.event)} · ${esc(r.head_branch||'main')}</small></div><span>${r.status==='completed'?(r.conclusion==='success'?'成功':'失败'):'进行中'}</span><a href="${esc(r.html_url)}" target="_blank">查看</a></div>`).join(''):'<div class="empty">暂无 Actions 记录或当前 Token 没有 Actions 权限。</div>'}</div>`;$('refreshRuns').onclick=()=>renderPublish()}

function openCommand(){const actions=[['fa-pencil','新建文章',()=>openEditor()],['fa-file-text-o','文章管理',()=>setView('posts')],['fa-comment-o','Moments',()=>setView('moments')],['fa-picture-o','媒体与封面',()=>setView('media')],['fa-tags','分类与标签',()=>setView('taxonomy')],['fa-cloud-upload','发布中心',()=>setView('publish')],['fa-sliders','设置',()=>setView('settings')],['fa-github','GitHub 文档同步',()=>setView('sync')],['fa-globe','打开博客',()=>window.open('/','_blank')]];$('commandList').innerHTML=actions.map((a,i)=>`<button class="command-item" data-ci="${i}"><i class="fa ${a[0]}"></i><span>${a[1]}</span></button>`).join('');document.querySelectorAll('.command-item').forEach((b,i)=>b.onclick=()=>{closeModal('commandModal');actions[i][2]()});$('commandInput').value='';$('commandModal').classList.add('open');$('commandModal').setAttribute('aria-hidden','false');$('commandInput').focus()}

async function saveDraftRemote(){if(!editor)return;const title=$('title').value.trim()||'未命名草稿',body=editor.value();if(!body.trim())return saveDraft(true);const meta={...editorMeta(),status:'draft'},slug=slugify(title),path='source/_drafts/'+slug+'.md';try{$('draftBtn').disabled=true;const same=currentPath===path;await api('contents/'+path,'PUT',{message:'保存草稿: '+title,content:encode(buildFM(title,$('category').value.trim(),selectedTags,$('coverImg').value.trim(),$('summary').value.trim(),[...posts,...drafts].find(p=>p.path===currentPath)?.date,meta)+body),branch:BRANCH,...(same&&currentSha?{sha:currentSha}:{})});if(currentPath&&currentPath!==path&&currentPath.startsWith('source/_drafts/'))await api('contents/'+currentPath,'DELETE',{message:'移动草稿: '+title,sha:currentSha,branch:BRANCH});currentPath=path;currentSha=null;localStorage.removeItem(DRAFT_KEY);toast('草稿已保存到 GitHub');await loadData()}catch(e){toast('草稿保存失败：'+e.message,'error')}finally{$('draftBtn').disabled=false}}
async function publish(){const title=$('title').value.trim(),body=editor.value();if(!title)return toast('请输入标题','error');if(!body.trim())return toast('请输入正文','error');const meta=editorMeta(),old=[...posts,...drafts].find(p=>p.path===currentPath||p.slug===currentSlug),slug=slugify(title),dir=meta.status==='draft'?'source/_drafts':'source/_posts',path=dir+'/'+slug+'.md';try{$('publishBtn').disabled=true;const same=currentPath===path;await api('contents/'+path,'PUT',{message:meta.status==='draft'?'保存草稿: '+title:(currentSha?'更新: ':'新增: ')+title,content:encode(buildFM(title,$('category').value.trim(),selectedTags,$('coverImg').value.trim(),$('summary').value.trim(),old?.date,meta)+body),branch:BRANCH,...(same&&currentSha?{sha:currentSha}:{})});if(currentPath&&currentPath!==path)await api('contents/'+currentPath,'DELETE',{message:'移动文章: '+title,sha:currentSha,branch:BRANCH});localStorage.removeItem(DRAFT_KEY);closeModal('editorModal');toast(meta.status==='draft'?'草稿已保存到 GitHub':'文章已提交，GitHub Actions 将自动构建');await loadData();if(meta.status!=='draft')setView('publish')}catch(e){toast('保存失败：'+e.message,'error')}finally{$('publishBtn').disabled=false}}
async function deletePost(slug,sha,title,path){if(!confirm('确定删除「'+(title||slug)+'」？此操作会直接提交 GitHub。'))return;try{await api('contents/'+(path||('source/_posts/'+encodeURIComponent(slug)+'.md')),'DELETE',{message:'删除: '+slug,sha,branch:BRANCH});toast('文章已删除');await loadData()}catch(e){toast('删除失败：'+e.message,'error')}}
function renderPosts(){const q=($('postQuery')?.value||'').toLowerCase(),filter=$('postFilter')?.value||'all',all=[...posts,...drafts];let list=all.filter(p=>!q||((p.title||'')+' '+p.slug+' '+(p.body||'')).toLowerCase().includes(q));if(filter==='tag')list=list.filter(p=>p.tags.length);if(filter==='uncat')list=list.filter(p=>!p.categories);if(filter==='draft')list=list.filter(p=>p.isDraft||p.status==='draft');if(filter==='hidden')list=list.filter(p=>p.status==='hidden');let rows=list.map(p=>'<div class="table-row"><div><strong>'+esc(p.title||p.slug)+'</strong><small>'+esc(p.slug)+'</small></div><span>'+(p.isDraft?'草稿':p.status==='hidden'?'隐藏':'已发布')+(p.sticky?' · 置顶':'')+'</span><span>'+esc(p.categories||'—')+'</span><span>'+esc(p.series||'—')+'</span><span>'+esc((p.date||'').slice(0,10))+'</span><div class="row-actions"><button class="mini-btn edit-post" data-i="'+all.indexOf(p)+'"><i class="fa fa-pencil"></i></button><button class="mini-btn danger-mini delete-post" data-i="'+all.indexOf(p)+'"><i class="fa fa-trash-o"></i></button></div></div>').join('');$('view-posts').innerHTML='<div class="page-head"><div><p class="kicker">CONTENT</p><h1>文章</h1><p>'+all.length+' 篇内容 · 正式文章、草稿和隐藏文章统一由 Git 管理。</p></div><button id="newPost"><i class="fa fa-pencil"></i> 新建文章</button></div><div class="toolbar"><div class="search-field"><i class="fa fa-search"></i><input id="postQuery" value="'+esc(q)+'" placeholder="搜索标题、Slug、正文…"></div><select id="postFilter"><option value="all">全部</option><option value="draft">草稿</option><option value="hidden">隐藏</option><option value="tag">有标签</option><option value="uncat">未分类</option></select><button class="secondary" id="refreshPosts"><i class="fa fa-refresh"></i> 刷新</button></div><div class="panel post-table"><div class="table-head"><span>文章</span><span>状态</span><span>分类</span><span>系列</span><span>日期</span><span></span></div>'+(rows||'<div class="empty">没有匹配内容</div>')+'</div>';$('newPost').onclick=()=>openEditor();$('postQuery').oninput=renderPosts;$('postFilter').onchange=renderPosts;$('refreshPosts').onclick=loadData;document.querySelectorAll('.edit-post').forEach(b=>b.onclick=()=>openEditor(all[+b.dataset.i]));document.querySelectorAll('.delete-post').forEach(b=>b.onclick=()=>{const p=all[+b.dataset.i];deletePost(p.slug,p.sha,p.title,p.path)})}
function renderMoments(){loadMoments().then(()=>{$('view-moments').innerHTML='<div class="page-head"><div><p class="kicker">PERSONAL LOG</p><h1>Moments</h1><p>记录开发、生活与灵感碎片，支持编辑、删除和标签管理。</p></div><button id="newMoment"><i class="fa fa-comment-o"></i> 新建动态</button></div><div id="momentEditor" class="panel moment-editor" hidden><div class="panel-head"><h2 id="momentEditorTitle">新建动态</h2><button class="icon-btn" id="closeMoment"><i class="fa fa-times"></i></button></div><div class="field"><label>内容</label><textarea id="momentContent" rows="5" placeholder="今天做了什么？"></textarea></div><div class="editor-meta"><div class="field"><label>日期</label><input id="momentDate" type="datetime-local"></div><div class="field grow"><label>标签</label><input id="momentTags" placeholder="Rust, Linux"></div></div><div><button class="secondary" id="cancelMoment">取消</button> <button id="saveMoment">保存到 GitHub</button></div></div><div class="moment-list">'+(moments.length?moments.map((m,i)=>'<article class="moment-card"><time>'+esc(m.date)+'</time><p>'+esc(m.content)+'</p><div><span>'+esc(m.tags||'')+'</span><div><button class="mini-btn edit-moment" data-mi="'+i+'"><i class="fa fa-pencil"></i></button><button class="mini-btn danger-mini delete-moment" data-mi="'+i+'"><i class="fa fa-trash-o"></i></button></div></div></article>').join(''):'<div class="empty">暂无 Moments</div>')+'</div>' ;const show=m=>{$('momentEditor').hidden=false;editingMoment=m?.key||null;$('momentEditorTitle').textContent=m?'编辑动态':'新建动态';$('momentContent').value=m?.content||'';$('momentDate').value=m?.date?m.date.replace(' ','T').slice(0,16):new Date().toISOString().slice(0,16);$('momentTags').value=m?.tags||'';$('momentContent').focus()};$('newMoment').onclick=()=>show(null);$('closeMoment').onclick=$('cancelMoment').onclick=()=>{$('momentEditor').hidden=true;editingMoment=null};$('saveMoment').onclick=saveMoment;document.querySelectorAll('.edit-moment').forEach(b=>b.onclick=()=>show(moments[+b.dataset.mi]));document.querySelectorAll('.delete-moment').forEach(b=>b.onclick=()=>removeMoment(+b.dataset.mi))})}
async function saveMoment(){const content=$('momentContent').value.trim(),date=$('momentDate').value.replace('T',' '),tags=$('momentTags').value.trim();if(!content)return toast('请输入内容','error');try{const r=await api('contents/'+MOMENTS_PATH),items=parseMoments(decode(r.content));if(editingMoment){const i=items.findIndex(x=>x.key===editingMoment);if(i>=0)items[i]={...items[i],content,date:date||items[i].date,tags}}else items.unshift({key:'moment-'+Date.now(),date:date||new Date().toISOString().replace('T',' ').slice(0,16),content,tags});await api('contents/'+MOMENTS_PATH,'PUT',{message:editingMoment?'更新: Moments':'新增: Moments',content:encode(momentsYaml(items)),sha:r.sha,branch:BRANCH});toast(editingMoment?'Moments 已更新':'Moments 已保存');editingMoment=null;await loadMoments();setView('moments')}catch(e){toast('保存失败：'+e.message,'error')}}
async function renderPublish(){let runs=[];try{runs=(await api('actions/runs?per_page=10')).workflow_runs||[]}catch(e){}let rows=runs.map(r=>'<div class="deploy-row"><span class="run-dot '+(r.conclusion==='success'?'ok':r.status==='in_progress'||r.status==='queued'?'run':'bad')+'"></span><div><strong>'+esc(r.name)+'</strong><small>'+esc(r.head_commit?.message||r.event)+' · '+esc(r.head_branch||'main')+'</small></div><span>'+(r.status==='completed'?(r.conclusion==='success'?'成功':'失败'):(r.status==='queued'?'排队中':'进行中'))+'</span><a href="'+esc(r.html_url)+'" target="_blank">查看</a>'+(r.status==='completed'&&r.conclusion!=='success'?'<button class="mini-btn rerun-run" data-run="'+r.id+'"><i class="fa fa-refresh"></i></button>':'')+(r.status==='in_progress'||r.status==='queued'?'<button class="mini-btn danger-mini cancel-run" data-run="'+r.id+'"><i class="fa fa-stop"></i></button>':'')+'</div>').join('');$('view-publish').innerHTML='<div class="page-head"><div><p class="kicker">DELIVERY</p><h1>发布中心</h1><p>内容 → Commit → Actions → Pages。可直接重跑或取消部署。</p></div><a class="button secondary" href="https://github.com/'+REPO+'/actions" target="_blank"><i class="fa fa-github"></i> Actions</a></div><div class="pipeline"><div><i class="fa fa-pencil"></i><strong>内容</strong><span>Markdown / YAML</span></div><b>→</b><div><i class="fa fa-code-fork"></i><strong>Commit</strong><span>main</span></div><b>→</b><div><i class="fa fa-cogs"></i><strong>Build</strong><span>Hexo</span></div><b>→</b><div><i class="fa fa-globe"></i><strong>Pages</strong><span>emoeem.github.io</span></div></div><div class="panel"><div class="panel-head"><h2>最近部署</h2><button class="text-btn" id="refreshRuns">刷新</button></div>'+(rows||'<div class="empty">暂无 Actions 记录或当前 Token 没有 Actions 权限。</div>')+'</div>';$('refreshRuns').onclick=renderPublish;document.querySelectorAll('.rerun-run').forEach(b=>b.onclick=async()=>{try{await api('actions/runs/'+b.dataset.run+'/rerun','POST',{});toast('已请求重新运行');setTimeout(renderPublish,800)}catch(e){toast('重新运行失败：'+e.message,'error')}});document.querySelectorAll('.cancel-run').forEach(b=>b.onclick=async()=>{if(!confirm('确定取消这个部署？'))return;try{await api('actions/runs/'+b.dataset.run+'/cancel','POST',{});toast('已请求取消部署');setTimeout(renderPublish,800)}catch(e){toast('取消失败：'+e.message,'error')}})}
function mediaPathFromUrl(url){return 'source/img/'+url.replace(/^\/img\//,'')}
async function renameMedia(item){const next=prompt('新的文件名',item.name);if(!next||next===item.name)return;const safe=next.normalize('NFKC').replace(/[^\w\u4e00-\u9fff.-]+/g,'-').replace(/^-+|-+$/g,'');if(!safe||!/\.(?:jpe?g|png|webp|gif)$/i.test(safe))return toast('文件名或扩展名无效','error');const target=item.path.replace(/[^/]+$/,safe);try{await api('contents/'+target,'PUT',{message:'重命名图片: '+item.name,content:(await api('contents/'+item.path)).content,branch:BRANCH});await api('contents/'+item.path,'DELETE',{message:'删除旧图片: '+item.name,sha:item.sha,branch:BRANCH});toast('图片已重命名');await loadMedia();renderMedia()}catch(e){toast('重命名失败：'+e.message,'error')}}
async function deleteMedia(item){const used=[...posts,...drafts].filter(p=>(p.body||'').includes(item.url)).map(p=>p.title||p.slug);if(used.length&&!confirm('这张图片仍被文章引用：'+used.join('、')+'。确定删除？'))return;if(!used.length&&!confirm('确定删除图片「'+item.name+'」？'))return;try{await api('contents/'+item.path,'DELETE',{message:'删除图片: '+item.name,sha:item.sha,branch:BRANCH});toast('图片已删除');await loadMedia();renderMedia()}catch(e){toast('删除图片失败：'+e.message,'error')}}
async function uploadMediaFile(file){if(!file)return;if(!/^image\/(?:jpeg|png|webp|gif)$/.test(file.type))return toast('仅支持 JPG、PNG、WebP、GIF','error');if(file.size>10*1024*1024)return toast('图片不能超过 10 MB','error');const name=file.name.normalize('NFKC').replace(/[^\w\u4e00-\u9fff.-]+/g,'-').replace(/^-+|-+$/g,'');if(!name)return toast('无法识别图片文件名','error');const path='source/img/featureimages/'+name;try{await api('contents/'+path);return toast('同名图片已存在，请换一个文件名','error')}catch(e){if(!/^404 /.test(e.message))return toast('检查图片失败：'+e.message,'error')}try{toast('正在上传图片…','success');const bytes=new Uint8Array(await file.arrayBuffer());await api('contents/'+path,'PUT',{message:'上传封面: '+name,content:bytesToBase64(bytes),branch:BRANCH});const src='/img/featureimages/'+name;$('coverImg').value=src;await loadMedia();renderMedia();if($('coverModal').classList.contains('open'))renderCoverGrid();toast('图片已上传到 GitHub')}catch(e){toast('图片上传失败：'+e.message,'error')}finally{$('mediaUploadInput').value=''}}
function renderMedia(){const q=($('mediaQuery')?.value||'').toLowerCase(),list=mediaItems.filter(x=>x.url.toLowerCase().includes(q)||x.name.toLowerCase().includes(q));let cards=list.map(x=>'<div class="media-card media-managed"><img loading="lazy" src="'+esc(x.url)+'" onerror="this.remove()"><span>'+esc(x.name)+'</span><small>'+((x.size/1024).toFixed(1))+' KB · <span class="media-dim">尺寸读取中</span></small><div><button class="mini-btn" data-copy-md="'+esc(x.url)+'" title="复制 Markdown"><i class="fa fa-code"></i></button><button class="mini-btn" data-copy-html="'+esc(x.url)+'" title="复制 HTML"><i class="fa fa-link"></i></button><button class="mini-btn" data-rename-media="'+esc(x.path)+'" title="重命名"><i class="fa fa-pencil"></i></button><button class="mini-btn danger-mini" data-delete-media="'+esc(x.path)+'" title="删除"><i class="fa fa-trash-o"></i></button></div></div>').join('');$('view-media').innerHTML='<div class="page-head"><div><p class="kicker">MEDIA</p><h1>媒体与封面</h1><p>'+mediaItems.length+' 张图片。图片写入源码仓库的 source/img，支持搜索、复制、重命名和删除。</p></div><div><button class="secondary" id="uploadMediaBtn"><i class="fa fa-upload"></i> 上传图片</button><button class="secondary" id="randomMedia"><i class="fa fa-random"></i> 随机封面</button></div></div><div class="toolbar"><div class="search-field"><i class="fa fa-search"></i><input id="mediaQuery" value="'+esc(q)+'" placeholder="搜索文件名…"></div></div><div class="media-grid">'+(cards||'<div class="empty">没有匹配图片</div>')+'</div>';$('mediaQuery').oninput=renderMedia;$('uploadMediaBtn').onclick=()=>$('mediaUploadInput').click();$('randomMedia').onclick=()=>{if(!covers.length)return;openEditor();$('coverImg').value=covers[Math.floor(Math.random()*covers.length)]};document.querySelectorAll('[data-copy-md]').forEach(b=>b.onclick=()=>navigator.clipboard?.writeText('![]('+b.dataset.copyMd+')').then(()=>toast('Markdown 图片链接已复制')));document.querySelectorAll('[data-copy-html]').forEach(b=>b.onclick=()=>navigator.clipboard?.writeText('<img src="'+b.dataset.copyHtml+'">').then(()=>toast('HTML 图片链接已复制')));document.querySelectorAll('[data-rename-media]').forEach(b=>b.onclick=()=>renameMedia(mediaItems.find(x=>x.path===b.dataset.renameMedia)));document.querySelectorAll('[data-delete-media]').forEach(b=>b.onclick=()=>deleteMedia(mediaItems.find(x=>x.path===b.dataset.deleteMedia)));document.querySelectorAll('.media-managed img').forEach(img=>img.onload=()=>{const e=img.parentElement.querySelector('.media-dim');if(e)e.textContent=img.naturalWidth+'×'+img.naturalHeight})}
