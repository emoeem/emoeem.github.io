<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>emoeem Studio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="./admin.css">
<link rel="stylesheet" href="./sync.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark">一</span><div><strong>emoeem Studio</strong><small>Personal Publishing Space</small></div></div>
  <div class="top-actions"><span id="connectionState" class="status-dot offline">未连接</span><button class="icon-btn" id="themeBtn" title="切换主题"><i class="fa fa-adjust"></i></button><a class="top-link" href="/" target="_blank"><i class="fa fa-external-link"></i> 博客</a><button class="top-link" id="logoutBtn">退出</button></div>
</header>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="loginView" class="login-view">
  <div class="login-card">
    <div class="login-icon"><i class="fa fa-lock"></i></div><p class="kicker">PRIVATE WORKSPACE</p><h1>进入 emoeem Studio</h1>
    <p>后台使用独立密码验证。GitHub 凭据不再参与登录，可在进入后台后的「设置」中配置。</p>
    <label>后台密码</label><div class="token-row"><input id="passwordInput" type="password" autocomplete="current-password" placeholder="输入后台密码"><button id="loginBtn">登录</button></div>
    <div class="hint"><i class="fa fa-info-circle"></i> 首次使用默认密码为 <code>emoemoemo</code>，登录后可在设置中修改。</div>
  </div>
</div>
<div id="app" class="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="side-group"><p class="side-label">工作台</p><button class="nav-item active" data-view="dashboard"><i class="fa fa-th-large"></i><span>概览</span></button></div>
    <div class="side-group"><p class="side-label">内容</p><button class="nav-item" data-view="posts"><i class="fa fa-file-text-o"></i><span>文章</span><b id="postCount"></b></button><button class="nav-item" data-view="moments"><i class="fa fa-comment-o"></i><span>Moments</span></button></div>
    <div class="side-group"><p class="side-label">资源</p><button class="nav-item" data-view="media"><i class="fa fa-picture-o"></i><span>媒体与封面</span></button><button class="nav-item" data-view="taxonomy"><i class="fa fa-tags"></i><span>分类与标签</span></button></div>
    <div class="side-group"><p class="side-label">发布</p><button class="nav-item" data-view="publish"><i class="fa fa-cloud-upload"></i><span>发布中心</span></button></div>
    <div class="side-group"><p class="side-label">系统</p><button class="nav-item" data-view="settings"><i class="fa fa-sliders"></i><span>设置</span></button></div>
    <div class="side-bottom"><div class="repo-card"><span>REPOSITORY</span><strong>emoeem/blog-source</strong><small>branch: main</small></div></div>
  </aside>
  <main class="main"><div class="mobile-head"><button id="menuBtn" class="icon-btn"><i class="fa fa-bars"></i></button><strong id="mobileTitle">概览</strong></div>
    <section id="view-dashboard" class="view active"></section>
    <section id="view-posts" class="view"></section>
    <section id="view-moments" class="view"></section>
    <section id="view-media" class="view"></section>
    <section id="view-taxonomy" class="view"></section>
    <section id="view-publish" class="view"></section>
    <section id="view-settings" class="view"></section>
  </main>
</div>
<div id="editorModal" class="modal" aria-hidden="true"><div class="modal-panel editor-panel"><div class="modal-head"><div><p class="kicker">WRITING STUDIO</p><h2 id="editorHeading">新建文章</h2></div><button class="icon-btn" data-close="editorModal"><i class="fa fa-times"></i></button></div>
  <div class="editor-meta"><div class="field grow"><label>标题</label><input id="title" placeholder="文章标题"></div><div class="field"><label>分类</label><input id="category" list="categoryList" placeholder="技术"><datalist id="categoryList"></datalist></div></div>
  <div class="field"><label>标签 <small>回车添加</small></label><div class="tag-input"><div id="selectedTags"></div><input id="tagInput" placeholder="Rust、Linux…"></div></div>
  <div class="editor-meta"><div class="field grow"><label>封面</label><div class="cover-input"><input id="coverImg" placeholder="/img/featureimages/custom_0.jpg"><button class="secondary" id="coverBtn"><i class="fa fa-picture-o"></i> 选择</button></div></div><div class="field"><label>摘要</label><input id="summary" placeholder="可选"></div></div>
  <div class="field editor-field"><label>正文 <span id="editorSaveState">尚未保存</span></label><textarea id="editor"></textarea></div>
  <div class="editor-foot"><span class="editor-tip"><kbd>Ctrl</kbd><kbd>S</kbd> 保存并提交 · <kbd>Ctrl</kbd><kbd>K</kbd> 命令/搜索</span><div><button class="secondary" id="draftBtn">保存草稿</button><button id="publishBtn">发布文章</button></div></div>
</div></div>
<div id="coverModal" class="modal" aria-hidden="true"><div class="modal-panel cover-panel"><div class="modal-head"><div><p class="kicker">MEDIA</p><h2>选择封面</h2></div><button class="icon-btn" data-close="coverModal"><i class="fa fa-times"></i></button></div><div class="cover-toolbar"><input id="coverSearch" placeholder="搜索图片文件名…"><button class="secondary" id="randomCover">随机</button></div><div id="coverGrid" class="cover-grid"></div></div></div>
<div id="commandModal" class="modal" aria-hidden="true"><div class="modal-panel command-panel"><div class="command-input"><i class="fa fa-search"></i><input id="commandInput" placeholder="输入命令或搜索文章…" autocomplete="off"></div><div id="commandList"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script>
const REPO='emoeem/blog-source',BRANCH='main',TOKEN_KEY='blog_gh_token',AUTH_KEY='blog_admin_auth',PASSWORD_HASH_KEY='blog_admin_password_hash',DRAFT_KEY='blog_editor_draft',MOMENTS_PATH='source/_data/shuoshuo.yml';
const DEFAULT_PASSWORD='emoemoemo';
let token=localStorage.getItem(TOKEN_KEY)||'',posts=[],tags=[],cats=[],selectedTags=[],currentSlug=null,currentSha=null,editor=null,autoTimer=null,currentView='dashboard',moments=[];
const covers=[...Array.from({length:24},(_,i)=>`/img/featureimages/${i}.jpg`),...['125824107_p0.jpg','126350108_p0.jpg','126473642_p0.jpg','126666381_p0.jpg','126768762_p0.jpg','126768762_p1.jpg','126932450_p0.jpg','127246755_p0.jpg','146170421_p0.jpg','custom_0.jpg','custom_1.jpg','custom_2.jpg','custom_3.jpg','custom_4.jpg','custom_5.jpg'].map(x=>`/img/featureimages/${x}`),...Array.from({length:6},(_,i)=>`/img/covers/cover-${i+1}.jpg`),'/img/cover.jpg'];
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t,type='success'){const e=$('toast');e.textContent=t;e.className=`toast show ${type}`;clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='toast',3600)}
function setView(view){currentView=view;document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===`view-${view}`));$('mobileTitle').textContent={dashboard:'概览',posts:'文章',moments:'Moments',media:'媒体与封面',taxonomy:'分类与标签',publish:'发布中心',settings:'设置'}[view];if(innerWidth<900)$('sidebar').classList.remove('open');renderView(view)}
function renderView(v){({dashboard:renderDashboard,posts:renderPosts,moments:renderMoments,media:renderMedia,taxonomy:renderTaxonomy,publish:renderPublish,settings:renderSettings}[v])()}
async function api(path,method='GET',body){const r=await fetch(`https://api.github.com/repos/${REPO}/${path}`,{method,headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok){let e={};try{e=await r.json()}catch{};throw Error(e.message||`${r.status} ${r.statusText}`)}return r.status===204?null:r.json()}
function decode(b64){const bytes=Uint8Array.from(atob(b64.replace(/\n/g,'')),c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function encode(s){return btoa(String.fromCharCode(...new TextEncoder().encode(s)))}
function parseFM(text){const out={title:'',date:'',categories:'',tags:[],img:'',summary:'',body:text};const m=text.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);if(!m)return out;out.body=m[2];const fm=m[1];for(const [key,rx] of [['title',/^title:\s*(.*)$/m],['date',/^date:\s*(.*)$/m],['categories',/^categories:\s*(.*)$/m],['img',/^img:\s*(.*)$/m],['summary',/^summary:\s*(.*)$/m]]){const x=fm.match(rx);if(x)out[key]=x[1].trim().replace(/^['"]|['"]$/g,'')}const sec=fm.match(/^tags:\s*\n((?:\s*-\s*.*\n?)*)/m);if(sec)out.tags=[...sec[1].matchAll(/^\s*-\s*(.+)$/gm)].map(x=>x[1].trim().replace(/^['"]|['"]$/g,''));return out}
async function loadData(){setConnection('连接中…','loading');try{const files=await api('contents/source/_posts');const loaded=[];for(const f of files.filter(x=>x.name.endsWith('.md'))){try{const r=await api(`contents/source/_posts/${encodeURIComponent(f.name)}`),p=parseFM(decode(r.content));p.slug=f.name.slice(0,-3);p.sha=r.sha;loaded.push(p)}catch{}}posts=loaded.sort((a,b)=>(b.date||'').localeCompare(a.date||''));const ct={},tg={};posts.forEach(p=>{if(p.categories)ct[p.categories]=(ct[p.categories]||0)+1;p.tags.forEach(t=>tg[t]=(tg[t]||0)+1)});cats=Object.keys(ct).sort();tags=Object.keys(tg).sort();$('postCount').textContent=posts.length;setConnection('已连接','online');renderView(currentView)}catch(e){setConnection('连接失败','error');toast(`加载失败：${e.message}`,'error')}}
function setConnection(text,state){$('connectionState').textContent=text;$('connectionState').className=`status-dot ${state}`}
async function hashPassword(value){const data=new TextEncoder().encode(value);const digest=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function getPasswordHash(){let hash=localStorage.getItem(PASSWORD_HASH_KEY);if(!hash){hash=await hashPassword(DEFAULT_PASSWORD);localStorage.setItem(PASSWORD_HASH_KEY,hash)}return hash}
async function verifyPassword(value){return (await hashPassword(value))===(await getPasswordHash())}
async function init(){$('loginView').hidden=true;$('app').hidden=false;initEditor();if(token){await Promise.all([loadMoments(),loadData()])}else{setConnection('未配置 GitHub','error');toast('请先到「设置」配置 GitHub Token','error')}renderView(currentView)}
$('loginBtn').onclick=async()=>{const value=$('passwordInput').value;if(!value)return toast('请输入密码','error');if(!(await verifyPassword(value)))return toast('密码错误','error');localStorage.setItem(AUTH_KEY,'1');$('passwordInput').value='';await init()};$('passwordInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});$('logoutBtn').onclick=()=>{localStorage.removeItem(AUTH_KEY);location.reload()};$('themeBtn').onclick=()=>{const dark=document.documentElement.classList.toggle('dark');localStorage.setItem('admin_dark',dark?'1':'0')};$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>setView(b.dataset.view));
function initEditor(){if(editor)return;editor=new EasyMDE({element:$('editor'),spellChecker:false,status:['lines','words','cursor'],minHeight:'430px',placeholder:'开始写 Markdown…',toolbar:['heading-2','heading-3','bold','italic','|','quote','unordered-list','ordered-list','|','link','image','code','table','horizontal-rule','|','preview','side-by-side','fullscreen','|','guide']});editor.codemirror.on('change',scheduleDraft);['title','category','tagInput','coverImg','summary'].forEach(id=>$(id).addEventListener('input',scheduleDraft));$('tagInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addTag(e.target.value.trim());e.target.value=''}});$('publishBtn').onclick=publish;$('draftBtn').onclick=()=>saveDraft(true);$('coverBtn').onclick=openCoverPicker}
function scheduleDraft(){clearTimeout(autoTimer);$('editorSaveState').textContent='正在保存…';autoTimer=setTimeout(()=>saveDraft(false),800)}
function saveDraft(show){if(!editor)return;localStorage.setItem(DRAFT_KEY,JSON.stringify({title:$('title').value,category:$('category').value,tags:selectedTags,coverImg:$('coverImg').value,summary:$('summary').value,body:editor.value(),updatedAt:new Date().toISOString()}));$('editorSaveState').textContent='本地草稿已保存';if(show)toast('草稿已保存在此浏览器')}
function restoreDraft(){try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY));if(!d)return;$('title').value=d.title||'';$('category').value=d.category||'';$('coverImg').value=d.coverImg||'';$('summary').value=d.summary||'';selectedTags=d.tags||[];editor.value(d.body||'');renderSelectedTags();$('editorSaveState').textContent='已恢复本地草稿'}catch{localStorage.removeItem(DRAFT_KEY)}}
function openEditor(post=null){currentSlug=post?.slug||null;currentSha=post?.sha||null;$('editorHeading').textContent=post?`编辑 · ${post.title||post.slug}`:'新建文章';$('title').value=post?.title||'';$('category').value=post?.categories||'';$('coverImg').value=post?.img||'';$('summary').value=post?.summary||'';selectedTags=post?.tags?.slice()||[];renderSelectedTags();editor.value(post?.body||'');$('editorSaveState').textContent=post?'已加载文章':'尚未保存';if(!post)restoreDraft();$('editorModal').classList.add('open');$('editorModal').setAttribute('aria-hidden','false');setTimeout(()=>$('title').focus(),80)}
function closeModal(id){$(id).classList.remove('open');$(id).setAttribute('aria-hidden','true')};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)closeModal(m.id)});
function addTag(t){if(t&&!selectedTags.includes(t)){selectedTags.push(t);if(!tags.includes(t))tags.push(t);renderSelectedTags()}}
function removeTag(t){selectedTags=selectedTags.filter(x=>x!==t);renderSelectedTags()};function renderSelectedTags(){$('selectedTags').innerHTML=selectedTags.map(t=>`<span class="tag-chip">${esc(t)} <button onclick="removeTag('${esc(t).replaceAll("'","\\'")}')">×</button></span>`).join('')}
function buildFM(title,cat,ts,img,summary,date){let s=`---\ntitle: ${title}\ndate: ${date||new Date().toISOString().replace('T',' ').slice(0,19)}\n`;if(cat)s+=`categories: ${cat}\n`;if(ts.length)s+='tags:\n'+ts.map(t=>`  - ${t}\n`).join('');if(img)s+=`img: ${img}\n`;if(summary)s+=`summary: ${summary}\n`;return s+'---\n\n'}
function slugify(s){return s.trim().replace(/[^\w\u4e00-\u9fff]+/g,'-').replace(/^-+|-+$/g,'')||'untitled'}
async function publish(){const title=$('title').value.trim(),body=editor.value();if(!title)return toast('请输入标题','error');if(!body.trim())return toast('请输入正文','error');const old=posts.find(p=>p.slug===currentSlug);const slug=slugify(title),path=`source/_posts/${slug}.md`;try{$('publishBtn').disabled=true;let sha=currentSha;if(currentSlug&&currentSlug!==slug){await api(`contents/source/_posts/${encodeURIComponent(currentSlug)}.md`,'DELETE',{message:`重命名: ${currentSlug}`,sha:currentSha,branch:BRANCH});sha=null}await api(`contents/${path}`,'PUT',{message:`${sha?'更新':'新增'}: ${title}`,content:encode(buildFM(title,$('category').value.trim(),selectedTags,$('coverImg').value.trim(),$('summary').value.trim(),old?.date)+body),branch:BRANCH,...(sha?{sha}:{})});localStorage.removeItem(DRAFT_KEY);closeModal('editorModal');toast('文章已提交，GitHub Actions 将自动构建');await loadData();setView('publish')}catch(e){toast(`发布失败：${e.message}`,'error')}finally{$('publishBtn').disabled=false}}
async function deletePost(slug,sha,title){if(!confirm(`确定删除「${title||slug}」？此操作会直接提交 GitHub。`))return;try{await api(`contents/source/_posts/${encodeURIComponent(slug)}.md`,'DELETE',{message:`删除: ${slug}`,sha,branch:BRANCH});toast('文章已删除');await loadData()}catch(e){toast(`删除失败：${e.message}`,'error')}}
function renderDashboard(){const recent=posts.slice(0,5);$('view-dashboard').innerHTML=`<div class="page-head"><div><p class="kicker">PERSONAL PUBLISHING SPACE</p><h1>你好，emoeem</h1><p>写代码、做开源项目，也记录正在发生的事情。</p></div><button id="dashNew"><i class="fa fa-pencil"></i> 新建文章</button></div><div class="stats"><div><span>文章</span><strong>${posts.length}</strong><small>全部文章</small></div><div><span>分类</span><strong>${cats.length}</strong><small>内容分类</small></div><div><span>标签</span><strong>${tags.length}</strong><small>内容标签</small></div><div><span>Moments</span><strong>${moments.length||'—'}</strong><small>碎片记录</small></div></div><div class="dash-grid"><div class="panel"><div class="panel-head"><h2>最近文章</h2><button class="text-btn" id="allPosts">查看全部</button></div>${recent.length?recent.map(postRow).join(''):'<div class="empty">还没有文章</div>'}</div><div class="panel"><div class="panel-head"><h2>快捷操作</h2></div><div class="quick-grid"><button id="quickNew"><i class="fa fa-pencil"></i> 写文章</button><button data-go="moments"><i class="fa fa-comment-o"></i> 写 Moments</button><button data-go="media"><i class="fa fa-picture-o"></i> 媒体库</button><button data-go="publish"><i class="fa fa-cloud-upload"></i> 发布状态</button></div><div class="workspace-note"><span class="note-icon"><i class="fa fa-code"></i></span><div><strong>Git 工作流</strong><p>内容 → Commit → Actions → Pages。后台不维护虚假数据库，仓库就是内容源。</p></div></div></div></div>`;$('dashNew').onclick=()=>openEditor();$('quickNew').onclick=()=>openEditor();$('allPosts').onclick=()=>setView('posts');$('view-dashboard').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setView(b.dataset.go));recent.forEach((p,i)=>{$(`dash-edit-${i}`)?.addEventListener('click',()=>openEditor(p))})}
function postRow(p,i){return `<div class="list-row"><div class="row-main"><span class="row-title">${esc(p.title||p.slug)}</span><span class="row-meta">${esc((p.date||'').slice(0,10))} · ${esc(p.categories||'未分类')}</span></div><button class="mini-btn" id="dash-edit-${i}"><i class="fa fa-pencil"></i></button></div>`}
function renderPosts(){const q=($('postQuery')?.value||'').toLowerCase(),filter=$('postFilter')?.value||'all';let list=posts.filter(p=>!q||`${p.title} ${p.slug} ${p.body}`.toLowerCase().includes(q));if(filter==='tag')list=list.filter(p=>p.tags.length);if(filter==='uncat')list=list.filter(p=>!p.categories);$('view-posts').innerHTML=`<div class="page-head"><div><p class="kicker">CONTENT</p><h1>文章</h1><p>${posts.length} 篇文章 · Markdown 源码直接托管在 GitHub。</p></div><button id="newPost"><i class="fa fa-pencil"></i> 新建文章</button></div><div class="toolbar"><div class="search-field"><i class="fa fa-search"></i><input id="postQuery" value="${esc(q)}" placeholder="搜索标题、Slug、正文…"></div><select id="postFilter"><option value="all">全部文章</option><option value="tag">有标签</option><option value="uncat">未分类</option></select><button class="secondary" id="refreshPosts"><i class="fa fa-refresh"></i> 刷新</button></div><div class="panel post-table"><div class="table-head"><span>文章</span><span>分类</span><span>标签</span><span>日期</span><span></span></div>${list.length?list.map((p)=>`<div class="table-row"><div><strong>${esc(p.title||p.slug)}</strong><small>${esc(p.slug)}</small></div><span>${esc(p.categories||'—')}</span><span class="tag-text">${esc(p.tags.join(' · ')||'—')}</span><span>${esc((p.date||'').slice(0,10))}</span><div class="row-actions"><button class="mini-btn edit-post" data-i="${posts.indexOf(p)}"><i class="fa fa-pencil"></i></button><button class="mini-btn danger-mini delete-post" data-i="${posts.indexOf(p)}"><i class="fa fa-trash-o"></i></button></div></div>`).join(''):'<div class="empty"><i class="fa fa-file-text-o"></i><strong>没有匹配文章</strong><span>换一个关键词试试。</span></div>'}</div>`;$('newPost').onclick=()=>openEditor();$('postQuery').oninput=renderPosts;$('postFilter').onchange=renderPosts;$('refreshPosts').onclick=loadData;document.querySelectorAll('.edit-post').forEach(b=>b.onclick=()=>openEditor(posts[+b.dataset.i]));document.querySelectorAll('.delete-post').forEach(b=>b.onclick=()=>{const p=posts[+b.dataset.i];deletePost(p.slug,p.sha,p.title)})}
function renderTaxonomy(){$('view-taxonomy').innerHTML=`<div class="page-head"><div><p class="kicker">ORGANIZE</p><h1>分类与标签</h1><p>从文章 Front Matter 自动汇总，不额外维护数据库。</p></div></div><div class="two-col"><div class="panel"><div class="panel-head"><h2>分类 <small>${cats.length}</small></h2></div><div class="taxonomy-list">${cats.map(c=>`<div><span><i class="fa fa-folder-o"></i>${esc(c)}</span><b>${posts.filter(p=>p.categories===c).length}</b></div>`).join('')||'<div class="empty">暂无分类</div>'}</div></div><div class="panel"><div class="panel-head"><h2>标签 <small>${tags.length}</small></h2></div><div class="tag-cloud">${tags.map(t=>`<button class="tag-chip" onclick="filterTag('${esc(t).replaceAll("'","\\'")}')">${esc(t)} <small>${posts.filter(p=>p.tags.includes(t)).length}</small></button>`).join('')||'<div class="empty">暂无标签</div>'}</div></div></div>`}
function filterTag(tag){setView('posts');setTimeout(()=>{$('postQuery').value=tag;renderPosts()},0)}
function renderMedia(){const q=($('mediaQuery')?.value||'').toLowerCase();const list=covers.filter(x=>x.toLowerCase().includes(q));$('view-media').innerHTML=`<div class="page-head"><div><p class="kicker">MEDIA</p><h1>媒体与封面</h1><p>${covers.length} 个已收录图片路径。选择图片后可直接用于文章封面。</p></div><button class="secondary" id="randomMedia"><i class="fa fa-random"></i> 随机封面</button></div><div class="toolbar"><div class="search-field"><i class="fa fa-search"></i><input id="mediaQuery" value="${esc(q)}" placeholder="搜索文件名…"></div></div><div class="media-grid">${list.map(src=>`<button class="media-card" data-src="${esc(src)}"><img loading="lazy" src="${esc(src)}" onerror="this.closest('.media-card').remove()"><span>${esc(src.split('/').pop())}</span></button>`).join('')}</div>`;$('mediaQuery').oninput=renderMedia;$('randomMedia').onclick=()=>{const src=covers[Math.floor(Math.random()*covers.length)];openEditor();$('coverImg').value=src};document.querySelectorAll('.media-card').forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.dataset.src);toast('图片路径已复制')})}
function openCoverPicker(){renderCoverGrid();$('coverModal').classList.add('open');$('coverModal').setAttribute('aria-hidden','false')}
function renderCoverGrid(){const q=($('coverSearch').value||'').toLowerCase();$('coverGrid').innerHTML=covers.filter(x=>x.toLowerCase().includes(q)).map(src=>`<button class="media-card" data-src="${esc(src)}"><img loading="lazy" src="${esc(src)}" onerror="this.closest('.media-card').remove()"><span>${esc(src.split('/').pop())}</span></button>`).join('');document.querySelectorAll('#coverGrid .media-card').forEach(b=>b.onclick=()=>{$('coverImg').value=b.dataset.src;closeModal('coverModal')})}
$('coverSearch').oninput=renderCoverGrid;$('randomCover').onclick=()=>{$('coverImg').value=covers[Math.floor(Math.random()*covers.length)];closeModal('coverModal')};
async function loadMoments(){try{const r=await api(`contents/${MOMENTS_PATH}`);moments=decode(r.content);moments=parseMoments(moments);return r}catch{moments=[]}}
function parseMoments(text){try{const data=jsyaml.load(text);return Array.isArray(data)?data.map(m=>({key:m.key||`moment-${Date.now()}`,date:String(m.date||''),author:m.author||'emoeem',content:String(m.content||'').trim(),tags:Array.isArray(m.tags)?m.tags.join(', '):String(m.tags||'')})):[]}catch{return[]}}
function renderMoments(){loadMoments().then(()=>{$('view-moments').innerHTML=`<div class="page-head"><div><p class="kicker">PERSONAL LOG</p><h1>Moments</h1><p>记录开发、生活与灵感碎片，直接写回 <code>shuoshuo.yml</code>。</p></div><button id="newMoment"><i class="fa fa-comment-o"></i> 新建动态</button></div><div id="momentEditor" class="panel moment-editor" hidden><div class="panel-head"><h2>编辑动态</h2><button class="icon-btn" id="closeMoment"><i class="fa fa-times"></i></button></div><div class="field"><label>内容</label><textarea id="momentContent" rows="5" placeholder="今天做了什么？"></textarea></div><div class="editor-meta"><div class="field"><label>日期</label><input id="momentDate" type="datetime-local"></div><div class="field grow"><label>标签</label><input id="momentTags" placeholder="Rust, Linux"></div></div><div><button class="secondary" id="cancelMoment">取消</button> <button id="saveMoment">保存到 GitHub</button></div></div><div class="moment-list">${moments.length?moments.map((m,i)=>`<article class="moment-card"><time>${esc(m.date)}</time><p>${esc(m.content)}</p><div><span>${esc(m.tags||'')}</span><button class="mini-btn danger-mini" data-mi="${i}"><i class="fa fa-trash-o"></i></button></div></article>`).join(''):'<div class="empty">暂无 Moments</div>'}</div>`;const show=()=>{$('momentEditor').hidden=false;$('momentContent').focus()};$('newMoment').onclick=show;$('closeMoment').onclick=$('cancelMoment').onclick=()=>{$('momentEditor').hidden=true};$('saveMoment').onclick=saveMoment;document.querySelectorAll('[data-mi]').forEach(b=>b.onclick=()=>removeMoment(+b.dataset.mi))})}
function momentsYaml(items){return jsyaml.dump(items.map(m=>({author:m.author||'emoeem',avatar:'/img/avatar.png',date:m.date,key:m.key,content:m.content,tags:m.tags?m.tags.split(',').map(x=>x.trim()).filter(Boolean):[]})),{lineWidth:1000,noRefs:true})}
async function saveMoment(){const content=$('momentContent').value.trim(),date=$('momentDate').value.replace('T',' '),tags=$('momentTags').value.trim();if(!content)return toast('请输入内容','error');try{const r=await api(`contents/${MOMENTS_PATH}`);const items=parseMoments(decode(r.content));items.unshift({key:`moment-${Date.now()}`,date:date||new Date().toISOString().replace('T',' ').slice(0,16),content,tags});await api(`contents/${MOMENTS_PATH}`,'PUT',{message:'新增: Moments',content:encode(momentsYaml(items)),sha:r.sha,branch:BRANCH});toast('Moments 已保存');setView('moments')}catch(e){toast(`保存失败：${e.message}`,'error')}}
async function removeMoment(i){if(!confirm('删除这条 Moments？'))return;try{const r=await api(`contents/${MOMENTS_PATH}`),items=parseMoments(decode(r.content));items.splice(i,1);await api(`contents/${MOMENTS_PATH}`,'PUT',{message:'删除: Moments',content:encode(momentsYaml(items)),sha:r.sha,branch:BRANCH});toast('Moments 已删除');setView('moments')}catch(e){toast(`删除失败：${e.message}`,'error')}}
async function renderPublish(){let runs=[];try{runs=(await api('actions/runs?per_page=8')).workflow_runs||[]}catch(e){}$('view-publish').innerHTML=`<div class="page-head"><div><p class="kicker">DELIVERY</p><h1>发布中心</h1><p>GitHub 是内容源，Actions 负责构建，Pages 负责展示。</p></div><a class="button secondary" href="https://github.com/${REPO}/actions" target="_blank"><i class="fa fa-github"></i> Actions</a></div><div class="pipeline"><div><i class="fa fa-pencil"></i><strong>内容</strong><span>Markdown / YAML</span></div><b>→</b><div><i class="fa fa-code-fork"></i><strong>Commit</strong><span>main</span></div><b>→</b><div><i class="fa fa-cogs"></i><strong>Build</strong><span>Hexo</span></div><b>→</b><div><i class="fa fa-globe"></i><strong>Pages</strong><span>emoeem.github.io</span></div></div><div class="panel"><div class="panel-head"><h2>最近部署</h2><button class="text-btn" id="refreshRuns">刷新</button></div>${runs.length?runs.map(r=>`<div class="deploy-row"><span class="run-dot ${r.conclusion==='success'?'ok':r.status==='in_progress'?'run':'bad'}"></span><div><strong>${esc(r.name)}</strong><small>${esc(r.head_commit?.message||r.event)} · ${esc(r.head_branch||'main')}</small></div><span>${r.status==='completed'?(r.conclusion==='success'?'成功':'失败'):'进行中'}</span><a href="${esc(r.html_url)}" target="_blank">查看</a></div>`).join(''):'<div class="empty">暂无 Actions 记录或当前 Token 没有 Actions 权限。</div>'}</div>`;$('refreshRuns').onclick=()=>renderPublish()}
function renderSettings(){$('view-settings').innerHTML=`<div class="page-head"><div><p class="kicker">WORKSPACE</p><h1>设置</h1><p>后台密码与 GitHub 凭据均保存在当前浏览器，不写入博客仓库。</p></div></div><div class="settings-grid"><div class="panel"><div class="panel-head"><h2>后台安全</h2></div><p class="setting-help">登录密码使用 SHA-256 哈希后保存。默认密码为 <code>emoemoemo</code>，建议首次登录后立即修改。</p><div class="field"><label>当前密码</label><input id="currentPassword" type="password" autocomplete="current-password"></div><div class="field"><label>新密码</label><input id="newPassword" type="password" autocomplete="new-password"></div><div class="field"><label>确认新密码</label><input id="confirmPassword" type="password" autocomplete="new-password"></div><button id="savePassword">修改后台密码</button></div><div class="panel"><div class="panel-head"><h2>GitHub 连接</h2></div><div class="setting-line"><span>Repository</span><strong>${REPO}</strong></div><div class="setting-line"><span>Branch</span><strong>${BRANCH}</strong></div><p class="setting-help">GitHub Token 仅用于文章、Moments、媒体和 Actions 操作，不再作为后台登录凭据。</p><div class="field"><label>Fine-grained Token</label><input id="settingsToken" type="password" autocomplete="off" placeholder="github_pat_…" value="${esc(token)}"></div><button id="saveToken">保存 GitHub Token</button></div><div class="panel"><div class="panel-head"><h2>外观</h2></div><div class="setting-line"><span>后台主题</span><strong>${document.documentElement.classList.contains('dark')?'深色':'浅色'}</strong></div><p class="setting-help">后台使用与 Butterfly 一致的米白、深灰、青绿色设计语言；不会修改前台主题设置。</p><button class="secondary" id="settingTheme">切换深浅色</button></div><div class="panel"><div class="panel-head"><h2>快捷键</h2></div><div class="shortcut"><kbd>Ctrl / ⌘</kbd><span>K</span><small>命令面板 / 搜索</small></div><div class="shortcut"><kbd>Ctrl / ⌘</kbd><span>S</span><small>保存并提交文章</small></div><div class="shortcut"><kbd>Esc</kbd><small>关闭弹窗</small></div></div></div>`;$('savePassword').onclick=async()=>{const current=$('currentPassword').value,n=$('newPassword').value,c=$('confirmPassword').value;if(!await verifyPassword(current))return toast('当前密码错误','error');if(n.length<8)return toast('新密码至少 8 位','error');if(n!==c)return toast('两次新密码不一致','error');localStorage.setItem(PASSWORD_HASH_KEY,await hashPassword(n));toast('后台密码已修改')};$('saveToken').onclick=async()=>{const t=$('settingsToken').value.trim();if(!/^github_pat_|^ghp_/.test(t))return toast('Token 格式不正确','error');token=t;localStorage.setItem(TOKEN_KEY,t);toast('GitHub Token 已保存');await Promise.all([loadMoments(),loadData()])};$('settingTheme').onclick=()=>{$('themeBtn').click();renderSettings()}}
function openCommand(){const actions=[['fa-pencil','新建文章',()=>openEditor()],['fa-file-text-o','文章管理',()=>setView('posts')],['fa-comment-o','Moments',()=>setView('moments')],['fa-picture-o','媒体与封面',()=>setView('media')],['fa-tags','分类与标签',()=>setView('taxonomy')],['fa-cloud-upload','发布中心',()=>setView('publish')],['fa-sliders','设置',()=>setView('settings')],['fa-globe','打开博客',()=>window.open('/','_blank')]];$('commandList').innerHTML=actions.map((a,i)=>`<button class="command-item" data-ci="${i}"><i class="fa ${a[0]}"></i><span>${a[1]}</span></button>`).join('');document.querySelectorAll('.command-item').forEach((b,i)=>b.onclick=()=>{closeModal('commandModal');actions[i][2]()});$('commandInput').value='';$('commandModal').classList.add('open');$('commandModal').setAttribute('aria-hidden','false');$('commandInput').focus()}
$('commandInput').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.command-item').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(q))};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.modal.open').forEach(m=>closeModal(m.id))}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCommand()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&$('editorModal').classList.contains('open')){e.preventDefault();publish()}});
const savedTheme=localStorage.getItem('admin_dark');if(savedTheme!=='0')document.documentElement.classList.add('dark');if(localStorage.getItem(AUTH_KEY)==='1')init();else $('loginView').hidden=false;
</script>
<script type="module" src="./sync.js"></script>
</body></html>
